<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0b10">
<title>Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{color-scheme:dark;--bg:#0c0b10;--s1:#15141b;--s2:#1e1c26;--s3:#2b2835;--fg:#f6f4fb;--mut:#9d99ab;--dim:#6d697c;--ac:#ff6a55;--ac2:#ffa15c;--r:18px;--ease:cubic-bezier(.2,.8,.2,1);--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,p{margin:0}
.page{position:relative;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px));animation:in .26s var(--ease) both}
.page.still{animation:none}
.page.hascta{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* beranda */
.hd{display:flex;align-items:center;padding:6px 0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.03em}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d0a}
.logo svg{width:15px;height:15px;fill:currentColor;stroke:none}
.sec{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.sec span{font-size:11px;background:var(--s2);padding:2px 8px;border-radius:99px;letter-spacing:0}
.hero{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--s2);isolation:isolate;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:transform .15s var(--ease)}
.hero:active{transform:scale(.985)}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,11,16,.94),rgba(12,11,16,.1) 70%)}
.hero .info{position:absolute;left:16px;right:78px;bottom:14px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.hero strong{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.fab{position:absolute;right:14px;bottom:14px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d0a;box-shadow:0 8px 20px rgba(255,106,85,.45)}
.fab svg,.badge svg,.btn.pri svg.pf{fill:currentColor;stroke:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px;align-items:start}
.card{display:block;width:100%;animation:in .4s var(--ease) both;animation-delay:var(--d,0ms)}
.im{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--s2);box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .15s var(--ease)}
.im::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);pointer-events:none}
.card:active .im{transform:scale(.97)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:800;color:var(--dim);background:linear-gradient(160deg,var(--s2),var(--s1))}
.badge{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px 4px 8px;border-radius:99px;background:rgba(12,11,16,.74);backdrop-filter:blur(8px);z-index:1}
.badge svg{width:10px;height:10px}
.card p{margin:10px 2px 0;font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* tombol umum */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:15px;font-weight:700;font-size:15px;transition:transform .12s var(--ease),opacity .12s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d0a;box-shadow:0 8px 22px rgba(255,106,85,.3)}
.btn.ghost{background:var(--s2)}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(30,28,38,.85);backdrop-filter:blur(8px);flex:none}
.nb{margin-bottom:10px}
.link{color:var(--ac2);font-weight:700;font-size:13px;padding:6px 0}

/* detail */
.bd{position:absolute;left:0;right:0;top:calc(-14px - env(safe-area-inset-top,0px));height:400px;overflow:hidden;z-index:-1;pointer-events:none}
.bd img{width:100%;height:100%;object-fit:cover;filter:blur(28px) brightness(.55) saturate(1.3);transform:scale(1.35)}
.bd::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,11,16,.15),var(--bg) 94%)}
.top{display:flex;gap:16px;align-items:flex-end;margin:18px 0 16px}
.pst{width:112px;flex:none;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--s2);box-shadow:0 14px 30px rgba(0,0,0,.55);position:relative}
.pst img{width:100%;height:100%;object-fit:cover;display:block}
.tt{min-width:0;display:flex;flex-direction:column;gap:9px}
.tt h1{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mut)}
.mt{white-space:nowrap}
.sc{display:inline-flex;align-items:center;gap:3px;color:var(--ac2)}
.sc svg{width:13px;height:13px;fill:currentColor;stroke:none}
.gen{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px)}
.syn{color:#cfcbda;font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.syn.open{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sh h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sh h2 span{color:var(--mut);font-weight:600;font-size:14px;margin-left:4px}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--fg)}
.eps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ep{position:relative;height:54px;border-radius:15px;background:var(--s2);display:grid;place-items:center;font-weight:700;font-size:15px;transition:transform .12s var(--ease)}
.ep:active{transform:scale(.95)}
.ep.seen{color:var(--dim)}
.ep .ck{position:absolute;top:6px;right:7px;width:12px;height:12px;color:var(--ac);stroke-width:3.5}
.ep.cur{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d0a}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:30px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 52%,rgba(12,11,16,0))}
.cta .btn{display:flex;width:100%;max-width:528px;margin:0 auto;min-height:54px;font-size:16px}

/* player */
.stick{position:sticky;top:0;z-index:10;margin:0 -16px 16px;background:#000}
.pl{position:relative;aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center;padding:14px}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pi{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.pt{flex:1;min-width:0}
.pt small{display:block;color:var(--mut);font-size:12.5px;font-weight:600;margin-bottom:3px}
.pt h1{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.nv{display:flex;gap:10px;margin-bottom:22px}
.nv .btn{flex:1;min-height:46px;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 16px;border-radius:99px;background:var(--s2);color:var(--mut);font-weight:700;font-size:13.5px}
.tab.on{background:var(--fg);color:var(--bg)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{padding:10px 16px;border-radius:13px;background:var(--s2);font-weight:600;font-size:14px;border:1.5px solid transparent}
.pill.on{border-color:var(--ac);background:rgba(255,106,85,.13);color:#ffd9d1}
.note{color:var(--dim);font-size:12.5px;margin:18px 2px 0}

/* status */
.sk{border-radius:var(--r);background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{text-align:center;padding:64px 12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.err .eic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--ac)}
.err .eic svg{width:28px;height:28px}
.err h1{font-size:20px;font-weight:800}
.err p{color:var(--mut);font-size:14px;max-width:300px;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0c0b10"); tg.setBackgroundColor("#0c0b10"); tg.disableVerticalSwipes(); } catch {}
}
const app = document.getElementById("app");
const stack = [];
let acts = {};

const I = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l11-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></svg>',
  ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  check: '<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3.4l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01M10.3 4.4L2.8 17.5A2 2 0 0 0 4.5 20.5h15a2 2 0 0 0 1.7-3L13.7 4.4a2 2 0 0 0-3.4 0z"/></svg>',
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const last = (s) => String(s).split("/").filter(Boolean).pop();
const tap = () => { try { tg.HapticFeedback.impactOccurred("light"); } catch {} };
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const img = (src) => src ? `<img src="${esc(src)}" referrerpolicy="no-referrer" decoding="async" alt="" onerror="this.remove()">` : "";
const posterOf = (a) => a.poster || store.get("poster:" + a.slug, "");

/* ---------- pembaca data (tahan terhadap bentuk JSON yang beda) ---------- */
function findEpisodes(o, d = 0) {
  if (!o || typeof o !== "object" || d > 4) return null;
  for (const [k, v] of Object.entries(o))
    if (/episode/i.test(k) && Array.isArray(v) && v.length && typeof v[0] === "object") return v;
  for (const v of Object.values(o)) { const r = findEpisodes(v, d + 1); if (r) return r; }
  return null;
}
function collectLinks(o, path = "", out = []) {
  if (typeof o === "string") {
    if (/^https?:\/\//.test(o) && /stream|embed|iframe|player|server/i.test(path) && !/download|dl|batch/i.test(path)) out.push(o);
  } else if (o && typeof o === "object") {
    for (const [k, v] of Object.entries(o)) collectLinks(v, path ? path + "." + k : k, out);
  }
  return out;
}
function collectServers(o, out = [], q = "") {
  if (Array.isArray(o)) o.forEach((x) => collectServers(x, out, q));
  else if (o && typeof o === "object") {
    const id = o.serverId ?? o.server_id ?? o.serverID;
    if (typeof id === "string" || typeof id === "number") {
      const name = String(o.name || o.server || o.title || o.quality || "").trim();
      out.push({ id: String(id), q, name, label: [q, name].filter(Boolean).join(" ") });
    }
    const nq = Array.isArray(o.serverList) ? String(o.title || "").trim() : q;
    Object.values(o).forEach((v) => collectServers(v, out, nq));
  }
  return out;
}
function pickUrl(o, d = 0) {
  if (typeof o === "string") return /^https?:\/\//.test(o) ? o : "";
  if (!o || typeof o !== "object" || d > 5) return "";
  for (const [k, v] of Object.entries(o))
    if (/url|embed|src|iframe|link/i.test(k)) { const r = pickUrl(v, d + 1); if (r) return r; }
  for (const v of Object.values(o)) { const r = pickUrl(v, d + 1); if (r) return r; }
  return "";
}

/* ---------- navigasi ---------- */
function go(fn) { stack.push(fn); render(); }
function swap(fn) { stack[stack.length - 1] = fn; render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function render() {
  window.scrollTo(0, 0);
  stack[stack.length - 1]();
  if (tg) stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
}
if (tg) tg.BackButton.onClick(back);
app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || !acts[b.dataset.act]) return;
  tap();
  acts[b.dataset.act](b);
});
const bar = () => (!tg && stack.length > 1 ? `<div class="nb"><button class="rb" data-act="back" aria-label="Kembali">${I.back}</button></div>` : "");
function show(html, o = {}) {
  app.innerHTML = `<div class="page${o.still ? " still" : ""}${o.cta ? " hascta" : ""}">${html}</div>${o.cta || ""}`;
}
function showError(e) {
  show(`${bar()}<div class="err"><div class="eic">${I.warn}</div><h1>Gagal memuat</h1><p>${esc(e.message)}. Server sumber kadang error atau kena batas request.</p><button class="btn pri" data-act="retry">Coba lagi</button></div>`);
  acts = { back, retry: () => render() };
}

/* ---------- beranda ---------- */
function home() {
  const lw = store.get("last", {});
  const recent = ANIME.filter((a) => lw[a.slug]).sort((x, y) => (lw[y.slug].t || 0) - (lw[x.slug].t || 0))[0];
  let html = `<header class="hd"><div class="brand"><span class="logo">${I.play}</span>Stream</div></header>`;
  if (recent) {
    const l = lw[recent.slug];
    html += `<h2 class="sec">Lanjut menonton</h2>
      <button class="hero" data-act="resume" data-slug="${esc(recent.slug)}">
        <div class="bg" data-pslug="${esc(recent.slug)}">${img(posterOf(recent))}</div><div class="shade"></div>
        <div class="info"><span class="tag">${esc(l.label)}</span><strong>${esc(recent.title)}</strong></div>
        <span class="fab">${I.play}</span></button>`;
  }
  html += `<h2 class="sec">Koleksi <span>${ANIME.length}</span></h2><div class="grid">` + ANIME.map((a, i) => {
    const l = lw[a.slug], p = posterOf(a);
    return `<button class="card" data-act="open" data-i="${i}" style="--d:${i * 45}ms"><div class="im" data-pslug="${esc(a.slug)}">${p ? img(p) : `<div class="ph">${esc(a.title.charAt(0))}</div>`}${l ? `<span class="badge">${I.play}${esc(l.label)}</span>` : ""}</div><p>${esc(a.title)}</p></button>`;
  }).join("") + "</div>";
  show(html);
  acts = {
    open: (b) => go(() => detail(ANIME[b.dataset.i])),
    resume: (b) => { const a = ANIME.find((x) => x.slug === b.dataset.slug), l = lw[a.slug]; go(() => play(a, l.id, l.label)); },
  };
  loadPosters();
}
function setPoster(slug, url) {
  document.querySelectorAll(`[data-pslug="${slug}"]`).forEach((el) => {
    if (el.querySelector("img")) return;
    const ph = el.querySelector(".ph"); if (ph) ph.remove();
    el.insertAdjacentHTML("afterbegin", img(url));
  });
}
async function loadPosters() {
  for (const a of ANIME) {
    if (posterOf(a)) continue;
    try {
      const d = await api("detail/" + encodeURIComponent(a.slug));
      const x = d.data || d, p = x.poster || x.image || x.thumbnail;
      if (p) { store.set("poster:" + a.slug, p); setPoster(a.slug, p); }
    } catch { break; }
  }
}

/* ---------- detail ---------- */
async function detail(a) {
  show(`${bar()}<div class="sk" style="height:200px;margin-top:18px"></div><div class="sk" style="height:18px;margin-top:22px;width:70%"></div><div class="sk" style="height:18px;margin-top:10px"></div><div class="eps" style="margin-top:28px">${'<div class="sk" style="height:54px"></div>'.repeat(8)}</div>`, { still: true });
  acts = { back };
  try {
    const d = await api("detail/" + encodeURIComponent(a.slug));
    const x = d.data || d;
    const eps = findEpisodes(d);
    if (!eps) throw new Error("daftar episode tidak ditemukan");
    const seen = new Set(store.get("seen:" + a.slug, []));
    const lw = store.get("last", {})[a.slug];
    const poster = a.poster || x.poster || x.image || x.thumbnail || posterOf(a);
    if (poster) store.set("poster:" + a.slug, poster);
    const syn = x.synopsis && Array.isArray(x.synopsis.paragraphs) ? x.synopsis.paragraphs.join(" ") : "";
    const mt = [x.status, x.type, x.episodes && x.episodes + " eps"].filter(Boolean).join(" · ");
    const meta = (x.score ? `<span class="sc">${I.star}${esc(x.score)}</span>` : "") + (mt ? `<span class="mt">${esc(mt)}</span>` : "");
    const gen = (x.genreList || []).slice(0, 4).map((g) => `<span class="chip">${esc(g.title)}</span>`).join("");
    const order = store.get("order", "new");
    const asc = eps.every((e) => typeof e.eps === "number") ? [...eps].sort((p, q) => p.eps - q.eps) : [...eps].reverse();
    const list = order === "old" ? asc : [...asc].reverse();
    const idOf = (ep) => last(ep.episodeId || ep.slug || ep.endpoint || ep.id || "");
    const lab = (ep, i) => (ep.eps != null ? "Ep " + ep.eps : String(ep.title || ep.episode || ep.name || "Ep " + (i + 1)).slice(0, 12));
    const first = asc[0];
    const cta = `<div class="cta"><button class="btn pri" data-act="play" data-id="${esc(lw ? lw.id : idOf(first))}" data-l="${esc(lw ? lw.label : lab(first, 0))}">${I.play.replace("<svg", '<svg class="pf"')}${lw ? "Lanjutkan " + esc(lw.label) : "Mulai " + esc(lab(first, 0))}</button></div>`;

    show(`<div class="bd">${img(poster)}</div>${bar()}
      <div class="top"><div class="pst">${img(poster)}</div>
        <div class="tt"><h1>${esc(a.title)}</h1><div class="meta">${meta}</div><div class="gen">${gen}</div></div></div>
      ${syn ? `<p class="syn" id="syn">${esc(syn)}</p><button class="link" data-act="more">Selengkapnya</button>` : ""}
      <div class="sh"><h2>Episode<span>${eps.length}</span></h2>
        <div class="seg"><button data-act="order" data-o="new" class="${order === "new" ? "on" : ""}">Terbaru</button><button data-act="order" data-o="old" class="${order === "old" ? "on" : ""}">Terlama</button></div></div>
      <div class="eps">${list.map((ep, i) => {
        const id = idOf(ep), l = lab(ep, i);
        return `<button class="ep${seen.has(id) ? " seen" : ""}${lw && lw.id === id ? " cur" : ""}" data-act="play" data-id="${esc(id)}" data-l="${esc(l)}">${esc(l)}${seen.has(id) && !(lw && lw.id === id) ? I.check : ""}</button>`;
      }).join("")}</div>`, { cta });
    acts = {
      back,
      more: (b) => { const s = document.getElementById("syn"); s.classList.toggle("open"); b.textContent = s.classList.contains("open") ? "Sembunyikan" : "Selengkapnya"; },
      order: (b) => { store.set("order", b.dataset.o); render(); },
      play: (b) => go(() => play(a, b.dataset.id, b.dataset.l)),
    };
  } catch (e) { showError(e); }
}

/* ---------- player ---------- */
async function play(a, id, label) {
  show(`${bar()}<div class="stick"><div class="pl"><div class="spin"></div></div></div><div class="sk" style="height:20px;width:60%"></div>`, { still: true });
  acts = { back };
  try {
    const d = await api(`episode/${encodeURIComponent(id)}?s=${encodeURIComponent(a.source)}`);
    const x = d.data || d;

    const no = String(x.title || "").match(/Episode\s*(\d+)/i);
    const lbl = no ? "Ep " + no[1] : label;
    const lw = store.get("last", {}); lw[a.slug] = { id, label: lbl, t: Date.now() }; store.set("last", lw);
    const sn = new Set(store.get("seen:" + a.slug, [])); sn.add(id); store.set("seen:" + a.slug, [...sn]);

    const opts = [], su = new Set(), ss = new Set();
    const addUrl = (u, l) => { if (u && !su.has(u)) { su.add(u); opts.push({ url: u, label: l, q: "", name: l }); } };
    addUrl(x.defaultStreamingUrl, "Utama");
    collectLinks(d).forEach((u) => addUrl(u, "Server"));
    collectServers(d).forEach((s) => { if (!ss.has(s.id)) { ss.add(s.id); opts.push(s); } });
    if (!opts.length) throw new Error("link nonton tidak ditemukan");

    const gk = [], groups = {};
    opts.forEach((o, i) => { const k = o.q || ""; if (!groups[k]) { groups[k] = []; gk.push(k); } groups[k].push([o, i]); });
    gk.sort((p, q) => (p === "" ? -1 : q === "" ? 1 : 0));

    const pv = x.prevEpisode && x.prevEpisode.episodeId, nx = x.nextEpisode && x.nextEpisode.episodeId;
    show(`${bar()}<div class="stick"><div class="pl" id="pl"><div class="spin"></div></div></div>
      <div class="pi"><div class="pt"><small>${esc(a.title)}</small><h1>${esc(x.title || label)}</h1></div>
        <button class="rb" data-act="ext" aria-label="Buka di browser">${I.ext}</button></div>
      ${pv || nx ? `<div class="nv">${pv ? `<button class="btn ghost" data-act="nav" data-id="${esc(pv)}">${I.back}Sebelumnya</button>` : ""}${nx ? `<button class="btn ghost" data-act="nav" data-id="${esc(nx)}">Berikutnya${I.next}</button>` : ""}</div>` : ""}
      <div class="tabs" id="tabs"></div><div class="pills" id="pills"></div>
      <p class="note">Layar kosong atau ikon sedih? Coba server lain, atau buka di browser lewat tombol di kanan atas judul.</p>`);

    let cur = -1, activeG = "", curUrl = "";
    const drawSrv = () => {
      document.getElementById("tabs").innerHTML = gk.map((k) => `<button class="tab${k === activeG ? " on" : ""}" data-act="tab" data-g="${esc(k)}">${esc(k || "Utama")}</button>`).join("");
      document.getElementById("pills").innerHTML = groups[activeG].map(([o, i]) => `<button class="pill${i === cur ? " on" : ""}" data-act="srv" data-i="${i}">${esc(activeG ? o.name || o.label : o.label)}</button>`).join("");
    };
    const choose = async (i) => {
      cur = i; activeG = opts[i].q || ""; drawSrv();
      const o = opts[i], pl = document.getElementById("pl");
      store.set("pref", o.label);
      pl.innerHTML = '<div class="spin"></div>';
      try {
        let u = o.url;
        if (!u) {
          const s = await api(`server/${encodeURIComponent(o.id)}?s=${encodeURIComponent(a.source)}`);
          u = pickUrl(s);
          if (!u) throw new Error("link server tidak ditemukan");
        }
        if (cur !== i) return;
        curUrl = u;
        pl.innerHTML = /\.(mp4|m3u8|webm)(\?|$)/i.test(u)
          ? `<video src="${esc(u)}" controls playsinline></video>`
          : `<iframe src="${esc(u)}" allowfullscreen allow="fullscreen; autoplay" referrerpolicy="no-referrer"></iframe>`;
      } catch (e) { if (cur === i) pl.textContent = "Server ini gagal: " + e.message; }
    };
    acts = {
      back,
      tab: (b) => { activeG = b.dataset.g; drawSrv(); if (groups[activeG].length === 1) choose(groups[activeG][0][1]); },
      srv: (b) => choose(+b.dataset.i),
      nav: (b) => swap(() => play(a, b.dataset.id, "Episode")),
      ext: () => { if (curUrl) tg ? tg.openLink(curUrl) : window.open(curUrl, "_blank"); },
    };
    const pref = store.get("pref", "");
    const qn = (o) => parseInt(o.q) || 0;
    let best = 0, bs = -1;
    opts.forEach((o, i) => { const s = (o.label === pref ? 100 : 0) + (/vidhide/i.test(o.name) ? 10 + qn(o) / 100 : 0); if (s > bs) { bs = s; best = i; } });
    choose(best);
  } catch (e) { showError(e); }
}

go(home);
</script>
